<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get a Quote | Shield & Castle Travel</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ================= YOUR ORIGINAL CSS (UNCHANGED) ================= */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy: #0d1f3c;
  --gold: #c9a84c;
  --gold-light: #e8c96a;
  --gold-pale: rgba(201,168,76,0.12);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Montserrat', sans-serif;
  background: var(--navy);
  min-height: 100vh;
  color: white;
  overflow-x: hidden;
}

/* KEEP ALL YOUR ORIGINAL STYLES (UNCHANGED) */

.step-panel { display: none; }
.step-panel.active { display: block; }

.success-panel { display: none; }
.success-panel.active { display: block; }

.btn-next, .btn-back { cursor: pointer; }

</style>
</head>

<body>

<form id="quoteForm">

<div class="bg-wrap">
  <div class="bg-lines"></div>
</div>

<div class="page">

  <!-- HEADER -->
  <div class="header">
    <a href="https://anthonyb888.github.io/index.html">
      <img src="https://anthonyb888.github.io/Shield-and-Castle-Logo.png" alt="Shield and Castle">
      <div class="header-brand">Shield <span>&</span> Castle</div>
    </a>

    <h1>Plan Your <em>Dream</em> Vacation</h1>
    <p>Complete in just 4 steps · Takes less than 2 minutes · 100% free</p>
  </div>

  <!-- PROGRESS (UNCHANGED) -->
  <div class="progress-wrap">
    <div class="progress-steps">
      <div class="step-dot active" id="dot-1"><div class="dot-circle">1</div></div>
      <div class="step-dot" id="dot-2"><div class="dot-circle">2</div></div>
      <div class="step-dot" id="dot-3"><div class="dot-circle">3</div></div>
      <div class="step-dot" id="dot-4"><div class="dot-circle">4</div></div>
    </div>
  </div>

  <div class="form-card">

    <!-- STEP 1 -->
    <div class="step-panel active" id="step-1">
      <input type="text" id="name" name="name" placeholder="Full Name" required>
      <input type="email" id="email" name="email" placeholder="Email" required>
      <input type="tel" id="phone" name="phone" placeholder="Phone">

      <button type="button" onclick="goTo(2)">Continue →</button>
    </div>

    <!-- STEP 2 -->
    <div class="step-panel" id="step-2">

      <input type="radio" name="destination" value="Walt Disney World"> Disney World<br>
      <input type="radio" name="destination" value="Disney Cruise Line"> Cruise<br>
      <input type="radio" name="destination" value="Disneyland"> Disneyland<br>
      <input type="radio" name="destination" value="Aulani"> Aulani<br>
      <input type="radio" name="destination" value="Universal Orlando"> Universal

      <button type="button" onclick="goTo(1)">Back</button>
      <button type="button" onclick="goTo(3)">Continue</button>
    </div>

    <!-- STEP 3 -->
    <div class="step-panel" id="step-3">

      <div>
        Adults:
        <button type="button" onclick="adjust('adults',-1)">-</button>
        <span id="adults-val">2</span>
        <button type="button" onclick="adjust('adults',1)">+</button>
      </div>

      <div>
        Children:
        <button type="button" onclick="adjust('children',-1)">-</button>
        <span id="children-val">0</span>
        <button type="button" onclick="adjust('children',1)">+</button>
      </div>

      <input type="date" name="travel_date">

      <select name="trip_length">
        <option>2–3 nights</option>
        <option>4–5 nights</option>
        <option>6–7 nights</option>
      </select>

      <input type="radio" name="budget" value="$1,500 – $3,000">
      <input type="radio" name="budget" value="$3,000 – $5,000">
      <input type="radio" name="budget" value="$5,000 – $8,000">

      <!-- hidden counters -->
      <input type="hidden" name="adults" id="adults-input">
      <input type="hidden" name="children" id="children-input">

      <button type="button" onclick="goTo(2)">Back</button>
      <button type="button" onclick="goTo(4)">Continue</button>
    </div>

    <!-- STEP 4 -->
    <div class="step-panel" id="step-4">

      <textarea name="notes" placeholder="Tell me about your trip"></textarea>

      <select name="referral">
        <option>Google</option>
        <option>Instagram</option>
        <option>Facebook</option>
        <option>Friend Referral</option>
      </select>

      <button type="button" onclick="goTo(3)">Back</button>
      <button type="button" onclick="submitForm()">✨ Send My Request</button>
    </div>

    <!-- SUCCESS -->
    <div class="success-panel" id="success">
      <div class="success-icon">✨</div>
      <h2>You're all set!</h2>
      <p>Your request has been received. You’ll hear back within 24 hours.</p>
    </div>

  </div>
</div>

</form>

<script>
let adults = 2;
let children = 0;

function adjust(type, delta) {
  if (type === 'adults') {
    adults = Math.max(1, adults + delta);
    document.getElementById('adults-val').innerText = adults;
  } else {
    children = Math.max(0, children + delta);
    document.getElementById('children-val').innerText = children;
  }
}

function goTo(step) {
  document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('step-' + step).classList.add('active');
}

/* ===== FORMSPREE SUBMISSION ===== */
async function submitForm() {

  document.getElementById("adults-input").value = adults;
  document.getElementById("children-input").value = children;

  const form = document.getElementById("quoteForm");

  const res = await fetch("https://formspree.io/f/xrejyqlw", {
    method: "POST",
    body: new FormData(form),
    headers: { Accept: "application/json" }
  });

  if (res.ok) {
    document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
    document.getElementById("success").classList.add("active");
  } else {
    alert("Something went wrong. Please try again.");
  }
}
</script>

</body>
</html>
