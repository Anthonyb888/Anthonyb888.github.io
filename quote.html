<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get a Quote | Shield & Castle Travel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ── YOUR ORIGINAL CSS (UNCHANGED) ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy: #0d1f3c;
  --navy-mid: #162847;
  --navy-light: #1e3a5f;
  --gold: #c9a84c;
  --gold-light: #e8c96a;
  --gold-pale: rgba(201,168,76,0.12);
  --cream: #f9f5ee;
  --warm-white: #fefcf8;
  --text-dark: #1a1a2e;
  --text-mid: #3d3d5c;
  --text-light: #7a7a9a;
  --success: #2d8a4e;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Montserrat', sans-serif;
  background: var(--navy);
  min-height: 100vh;
  color: white;
  overflow-x: hidden;
}

/* (ALL YOUR STYLES REMAIN EXACTLY THE SAME — omitted here for space) */
</style>
</head>

<body>

<div class="bg-wrap">
  <div class="bg-lines"></div>
</div>

<div class="page">

  <div class="header">
    <a href="https://anthonyb888.github.io/index.html">
      <img src="https://anthonyb888.github.io/Shield-and-Castle-Logo.png" alt="Shield and Castle">
      <div class="header-brand">Shield <span>&</span> Castle</div>
    </a>
    <h1>Plan Your <em>Dream</em> Vacation</h1>
    <p>Complete in just 4 steps · Takes less than 2 minutes · 100% free</p>
  </div>

  <div class="progress-wrap">
    <div class="progress-steps">
      <div class="step-dot active"><div class="dot-circle">1</div><div class="dot-label">You</div></div>
      <div class="step-dot"><div class="dot-circle">2</div><div class="dot-label">Destination</div></div>
      <div class="step-dot"><div class="dot-circle">3</div><div class="dot-label">Details</div></div>
      <div class="step-dot"><div class="dot-circle">4</div><div class="dot-label">Notes</div></div>
    </div>
  </div>

  <div class="form-card">

    <!-- STEP 1 -->
    <div class="step-panel active" id="step-1">
      <div class="field-group">
        <label>Full Name *</label>
        <input type="text" id="name" placeholder="Your full name">
      </div>

      <div class="field-group">
        <label>Email *</label>
        <input type="email" id="email" placeholder="you@email.com">
      </div>

      <button class="btn-next" onclick="goTo(2)">Continue →</button>
    </div>

    <!-- STEP 2 -->
    <div class="step-panel" id="step-2">
      <div class="field-group">
        <label>Destination</label>
        <input type="radio" name="destination" id="d1" value="Disney World"> Disney World
      </div>

      <button class="btn-back" onclick="goTo(1)">Back</button>
      <button class="btn-next" onclick="goTo(3)">Continue →</button>
    </div>

    <!-- STEP 3 -->
    <div class="step-panel" id="step-3">
      <input type="date" id="travel-date">
      <select id="trip-length">
        <option>2–3 nights</option>
        <option>4–5 nights</option>
      </select>

      <button class="btn-back" onclick="goTo(2)">Back</button>
      <button class="btn-next" onclick="goTo(4)">Continue →</button>
    </div>

    <!-- STEP 4 -->
    <div class="step-panel" id="step-4">
      <textarea id="notes"></textarea>

      <button class="btn-back" onclick="goTo(3)">Back</button>
      <button class="btn-next" onclick="submitForm()">Send Request ✨</button>
    </div>

    <!-- SUCCESS -->
    <div class="success-panel" id="success">
      <h2>You're all set, <span id="success-name">friend</span>!</h2>
      <p>Confirmation sent to <span id="success-email"></span></p>
    </div>

  </div>
</div>

<script>
let adults = 2, children = 0;

function goTo(step) {
  document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('step-' + step).classList.add('active');
}

async function submitForm() {

  const name = document.getElementById('name').value.trim() || 'friend';
  const email = document.getElementById('email').value.trim() || 'your email';

  const formData = new FormData();

  formData.append('name', name);
  formData.append('email', email);
  formData.append('travelDate', document.getElementById('travel-date').value);
  formData.append('tripLength', document.getElementById('trip-length').value);
  formData.append('notes', document.getElementById('notes').value);

  try {

    const response = await fetch(
      'https://formspree.io/f/xrejyqlw',
      {
        method: 'POST',
        body: formData,
        headers: {
          'Accept': 'application/json'
        }
      }
    );

    if (!response.ok) throw new Error('Failed');

    document.querySelectorAll('.step-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('success').classList.add('active');

    document.getElementById('success-name').textContent = name.split(' ')[0];
    document.getElementById('success-email').textContent = email;

  } catch (err) {
    alert('Error sending form. Try again.');
    console.error(err);
  }
}
</script>

</body>
</html>
